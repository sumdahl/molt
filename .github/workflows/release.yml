name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Releases are signed: the tag must carry an SSH signature from a key in
      # .github/allowed_signers, or nothing is built.
      - name: Tag must be signed by a maintainer
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ] || { echo "$GITHUB_REF_NAME is not an annotated tag"; exit 1; }
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/allowed_signers \
            verify-tag "$GITHUB_REF_NAME"

      - name: Tag must match Cargo.toml version
        run: |
          want="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }

      - name: CHANGELOG must have a section for this version
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }

      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy -t "$TARGET"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # SD-07 tests mount a tmpfs inside an unprivileged user namespace; Ubuntu blocks those by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test
      - run: cargo build --release --locked --target "$TARGET"

      - name: Smoke test release binary
        run: |
          bin="target/$TARGET/release/onyx"
          [ "$("$bin" --version)" = "onyx ${GITHUB_REF_NAME#v}" ]
          "$bin" --help > /dev/null

      # ponytail: x86_64 only; add an aarch64 matrix entry (ubuntu-24.04-arm) when there are arm users
      - name: Package
        run: packaging/tarball.sh "$GITHUB_REF_NAME" "$TARGET"

      # PK-04: built and installed in Arch before it's offered for the AUR.
      - name: AUR package
        run: |
          packaging/aur/fill.sh "${GITHUB_REF_NAME#v}" "onyx-$GITHUB_REF_NAME-$TARGET.tar.gz" aur
          docker run --rm -v "$PWD/aur:/pkg" -v "$PWD/packaging/aur/check.sh:/check.sh:ro" archlinux:latest sh /check.sh
          cp aur/PKGBUILD onyx-bin.PKGBUILD
          cp aur/.SRCINFO onyx-bin.SRCINFO

      # PK-05, PK-06: built from the same binary and installed in Debian first.
      - name: .deb package
        run: |
          packaging/deb/build.sh "${GITHUB_REF_NAME#v}" "onyx-$GITHUB_REF_NAME-$TARGET.tar.gz" deb
          docker run --rm -v "$PWD/deb:/pkg" -v "$PWD/packaging/deb/check.sh:/check.sh:ro" debian:stable sh /check.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "onyx $GITHUB_REF_NAME" --notes-file notes.md onyx-*.tar.gz onyx-*.sha256 onyx-bin.PKGBUILD onyx-bin.SRCINFO deb/onyx_*.deb deb/onyx_*.deb.sha256
