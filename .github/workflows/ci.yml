name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # SD-07 tests mount a tmpfs inside an unprivileged user namespace; Ubuntu blocks those by default.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # CO-04: the zsh and fish completion scripts are syntax-checked by those shells.
      - run: sudo apt-get install -y --no-install-recommends zsh fish
      - run: cargo test

  # PK-04: the release's packaging steps, run on every change against a local build.
  packages:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal -t "$TARGET"
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          packaging/tarball.sh "v$version" "$TARGET"
      - name: AUR package
        run: |
          packaging/aur/fill.sh "$VERSION" "onyx-v$VERSION-$TARGET.tar.gz" aur
          docker run --rm -v "$PWD/aur:/pkg" -v "$PWD/packaging/aur/check.sh:/check.sh:ro" archlinux:latest sh /check.sh
      - name: .deb package
        run: |
          packaging/deb/build.sh "$VERSION" "onyx-v$VERSION-$TARGET.tar.gz" deb
          docker run --rm -v "$PWD/deb:/pkg" -v "$PWD/packaging/deb/check.sh:/check.sh:ro" debian:stable sh /check.sh
