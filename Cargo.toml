[package]
name = "onyx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reclaim disk space on Linux, safely"
license = "MIT"
repository = "https://github.com/sumdahl/onyx"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
rustix = { version = "1.1.6", features = ["fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
