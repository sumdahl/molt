[package]
# PK-07: `onyx` is taken on crates.io; the library and the command keep the name.
name = "onyx-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Reclaim disk space on Linux, safely: a disk cleaner that dry-runs first"
license = "MIT"
repository = "https://github.com/sumdahl/onyx"
readme = "README.md"
keywords = ["disk", "cleaner", "cache", "linux", "cli"]
categories = ["command-line-utilities", "filesystem"]
# The built-in rules and (SE-09) the release signers are built into onyx.
include = [
    "/src/",
    "/rules/builtin.toml",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/.github/allowed_signers",
]

[lib]
name = "onyx"

[[bin]]
name = "onyx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
rustix = { version = "1.1.6", features = ["fs", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
